<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Moodboard · Artist OS</title>
<meta name="theme-color" content="#f4f3ef">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f3ef; --paper:#ffffff; --ink:#111111; --ink2:#4a4843; --ink3:#77746d; --line:#e3e1db; --line2:#d3d0c8;
  --soft:#ecebe6; --ok:#1f7a4a; --warn:#a2471b; --focus:#2b59ff;
  --r:14px; --r2:10px; --sh:0 1px 2px rgba(17,17,17,.05),0 6px 22px rgba(17,17,17,.06);
  --sh2:0 2px 6px rgba(17,17,17,.08),0 24px 60px rgba(17,17,17,.18);
  --serif:'Instrument Serif',Georgia,serif; --sans:'Inter Tight',system-ui,-apple-system,Segoe UI,sans-serif; --mono:'JetBrains Mono',ui-monospace,Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;min-height:100vh;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:6px}
img{display:block;max-width:100%}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

/* ── botones ── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 16px;border-radius:999px;font-weight:600;font-size:14px;white-space:nowrap;transition:background .15s,transform .1s,box-shadow .15s,color .15s}
.btn:active{transform:scale(.97)}
.btn.dark{background:var(--ink);color:#fff}
.btn.dark:hover{background:#2a2a2a}
.btn.ghost{color:var(--ink2)}
.btn.ghost:hover{background:var(--soft);color:var(--ink)}
.btn.line{border:1px solid var(--line2);background:var(--paper)}
.btn.line:hover{border-color:var(--ink3)}
.btn.lg{height:52px;padding:0 26px;font-size:16px}
.btn.sm{height:34px;padding:0 12px;font-size:13px}
.ib{width:40px;height:40px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;color:var(--ink2);transition:background .15s,color .15s}
.ib:hover{background:var(--soft);color:var(--ink)}

/* ── barra superior ── */
.top{position:sticky;top:0;z-index:40;background:rgba(244,243,239,.86);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid transparent;transition:border-color .2s}
.top.sc{border-bottom-color:var(--line)}
.top .in{max-width:1320px;margin:0 auto;height:64px;padding:0 24px;display:flex;align-items:center;gap:10px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:-.01em;font-size:15px;min-width:0}
.mark{width:28px;height:28px;border-radius:8px;background:var(--ink);display:grid;grid-template-columns:1fr 1fr;gap:3px;padding:6px;flex:none}
.mark i{background:#fff;border-radius:2px;opacity:.95}.mark i:nth-child(2){opacity:.55}.mark i:nth-child(3){opacity:.35}.mark i:nth-child(4){opacity:.8}
.brand .pn{color:var(--ink3);font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brand .sl{color:var(--line2);font-weight:400}
.top .sp{flex:1}
.save{display:inline-flex;align-items:center;gap:7px;font-size:13px;color:var(--ink3);padding:0 10px;height:30px;border-radius:999px;white-space:nowrap;transition:color .2s,background .2s}
.save i{width:7px;height:7px;border-radius:50%;background:var(--line2);transition:background .2s}
.save.ok{color:var(--ok)}.save.ok i{background:var(--ok)}
.save.busy i{background:#c79a1a;animation:pul 1s infinite}
.save.err{color:var(--warn)}.save.err i{background:var(--warn)}
@keyframes pul{50%{opacity:.3}}
.menuw{position:relative}
.menu{position:absolute;right:0;top:calc(100% + 8px);background:var(--paper);border:1px solid var(--line);border-radius:14px;box-shadow:var(--sh2);padding:6px;min-width:250px;display:none;z-index:60}
.menu.on{display:block;animation:pop .16s ease-out}
.menu button{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:10px 12px;border-radius:9px;font-size:14px;min-height:44px}
.menu button:hover{background:var(--soft)}
.menu button small{display:block;color:var(--ink3);font-size:12px;font-weight:400}
.menu button b{font-weight:600}
@keyframes pop{from{opacity:0;transform:translateY(-4px) scale(.98)}}

/* ── cabecera del tablero ── */
.wrap{max-width:1320px;margin:0 auto;padding:0 24px}
.hero{padding:44px 0 10px;display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:48px;align-items:start}
.hero>div:first-child{padding-top:28px}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.eyebrow .dot{width:4px;height:4px;border-radius:50%;background:var(--line2)}
.ttl{font-family:var(--serif);font-weight:400;font-size:clamp(46px,6.4vw,92px);line-height:.95;letter-spacing:-.02em;margin:14px 0 12px;width:100%;border:0;background:transparent;outline:none;padding:0;border-radius:8px}
.ttl:hover{background:linear-gradient(transparent 92%,var(--line) 92%)}
.ttl:focus{background:linear-gradient(transparent 92%,var(--ink) 92%)}
.ttl::placeholder{color:var(--line2)}
.sub{color:var(--ink2);font-size:16px;max-width:520px}
.prog{margin-top:22px;display:flex;align-items:center;gap:14px;font-size:13px;color:var(--ink3)}
.prog .bar{flex:0 0 160px;height:4px;border-radius:4px;background:var(--line);overflow:hidden}
.prog .bar i{display:block;height:100%;background:var(--ink);border-radius:4px;transition:width .5s cubic-bezier(.2,.8,.2,1)}
.prog b{color:var(--ink);font-weight:600}

.panel{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:20px 20px 18px;box-shadow:var(--sh)}
.panel+.panel{margin-top:14px}
.ph{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:12px}
.ph h3{font-size:13px;font-weight:600;letter-spacing:.02em}
.ph .hint{font-size:12px;color:var(--ink3)}
.ph button.lk{font-size:12.5px;color:var(--ink2);font-weight:600;padding:4px 8px;border-radius:8px;display:inline-flex;gap:6px;align-items:center}
.ph button.lk:hover{background:var(--soft)}

/* paleta */
.pal{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.sw{position:relative;border-radius:12px;height:76px;border:1px solid rgba(0,0,0,.06);display:flex;flex-direction:column;justify-content:flex-end;padding:8px;text-align:left;transition:transform .15s,box-shadow .15s;overflow:hidden}
.sw:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(0,0,0,.12)}
.sw .hx{font-family:var(--mono);font-size:10.5px;letter-spacing:.02em;opacity:.92}
.sw .pin{position:absolute;top:7px;right:7px;width:18px;height:18px;display:none}
.sw.fixed .pin{display:block}
.sw.empty{background:repeating-linear-gradient(-45deg,var(--soft) 0 6px,transparent 6px 12px);border:1px dashed var(--line2);align-items:center;justify-content:center;color:var(--ink3)}
.sw.empty:hover{color:var(--ink);border-color:var(--ink3)}
.palnote{font-size:12px;color:var(--ink3);margin-top:10px;display:flex;gap:6px;align-items:center}

/* palabras */
.words{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:4px;height:36px;padding:0 6px 0 14px;border-radius:999px;background:var(--ink);color:#fff;font-family:var(--serif);font-style:italic;font-size:19px;letter-spacing:.005em;animation:pop .2s ease-out}
.chip button{width:26px;height:26px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:#bbb}
.chip button:hover{background:#333;color:#fff}
.chip button svg{width:14px;height:14px}
.wordin{flex:1;min-width:150px;height:36px;border:1px dashed var(--line2);border-radius:999px;padding:0 14px;background:transparent;font-size:14px;outline:none}
.wordin:focus{border-style:solid;border-color:var(--ink)}
.sugg{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.sugg span{font-size:12px;color:var(--ink3);margin-right:2px;align-self:center}
.sugg button{height:30px;padding:0 11px;border-radius:999px;border:1px solid var(--line);font-size:13px;color:var(--ink2);background:var(--paper)}
.sugg button:hover{border-color:var(--ink);color:var(--ink)}

/* ── secciones ── */
.secs{padding:26px 0 40px}
.sec{padding:30px 0 6px;border-top:1px solid var(--line)}
.sec:first-child{border-top:0}
.sh{display:flex;align-items:center;gap:14px;margin-bottom:6px}
.sn{font-family:var(--mono);font-size:12px;color:var(--ink3);flex:none;width:24px}
.st{font-family:var(--serif);font-size:34px;line-height:1.1;letter-spacing:-.01em;border:0;background:transparent;outline:none;padding:2px 6px;margin-left:-6px;border-radius:8px;min-width:60px;flex:0 1 auto;max-width:100%;field-sizing:content;width:auto}
.st:hover{background:var(--soft)}
.st:focus{background:var(--paper);box-shadow:inset 0 0 0 1px var(--line2)}
.scount{font-size:12.5px;color:var(--ink3);white-space:nowrap}
.sacts{display:flex;gap:2px;margin-left:auto;flex:none}
.sacts .ib{width:36px;height:36px}
.shint{font-size:14px;color:var(--ink3);margin:0 0 16px 38px;max-width:640px}
.sec.drop-on .grid{outline:2px dashed var(--ink);outline-offset:8px;border-radius:12px}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));grid-auto-rows:2px;column-gap:14px;row-gap:0;align-items:start;margin-left:38px;min-height:40px}
.tile{position:relative;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
.tile .tin{padding-bottom:14px}
.card{position:relative;border-radius:var(--r);overflow:hidden;background:var(--paper);box-shadow:var(--sh);transition:box-shadow .2s,transform .2s;cursor:grab}
.tile:hover .card{box-shadow:0 2px 4px rgba(0,0,0,.06),0 14px 34px rgba(0,0,0,.12)}
.tile:focus-visible{outline:none}
.tile:focus-visible .card{box-shadow:0 0 0 2px var(--focus)}
.card img{width:100%;height:auto;background:var(--soft);pointer-events:none}
.cap{padding:10px 12px 12px;font-size:13px;color:var(--ink2);line-height:1.4}
.acts{position:absolute;top:8px;right:8px;display:flex;gap:4px;opacity:0;transform:translateY(-3px);transition:opacity .15s,transform .15s;z-index:2}
.tile:hover .acts,.tile:focus-within .acts{opacity:1;transform:none}
.acts button{width:32px;height:32px;border-radius:9px;background:rgba(255,255,255,.94);color:var(--ink);display:flex;align-items:center;justify-content:center;box-shadow:0 1px 3px rgba(0,0,0,.18)}
.acts button:hover{background:#fff}
.acts button.del:hover{color:#b3261e}
.acts svg{width:16px;height:16px}
@media (hover:none){.acts{display:none}}
.tcolor .swb{height:150px;display:flex;align-items:flex-end;padding:12px}
.tcolor .meta{padding:10px 12px 12px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.tcolor .meta b{font-family:var(--mono);font-weight:500;font-size:12.5px}
.tcolor .meta span{font-size:12.5px;color:var(--ink3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ttext .card{padding:22px 20px 20px;background:#fbfaf7}
.ttext q{display:block;font-family:var(--serif);font-size:22px;line-height:1.22;quotes:none;white-space:pre-wrap;word-break:break-word}
.ttext .card:before{content:"“";display:block;font-family:var(--serif);font-size:44px;line-height:.6;color:var(--line2);margin-bottom:6px}
.ttext .cap{padding:10px 0 0}
.tlink .thumb{aspect-ratio:16/10;background:#111;position:relative;display:flex;align-items:center;justify-content:center;color:#fff;overflow:hidden}
.tlink .thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tlink .thumb .pl{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:8px;font-weight:600;font-size:13px;letter-spacing:.02em}
.tlink .thumb .pl svg{width:30px;height:30px}
.tlink .thumb .play{position:relative;z-index:1;width:52px;height:52px;border-radius:50%;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center}
.tlink .thumb .play svg{width:20px;height:20px;fill:#fff;stroke:none;margin-left:3px}
.tlink .lmeta{padding:11px 12px 12px}
.tlink .lmeta b{display:block;font-size:13.5px;font-weight:600;line-height:1.3;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.tlink .lmeta span{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink3);margin-top:3px}
.tlink .lmeta a{color:inherit}
.pf-youtube{background:linear-gradient(135deg,#1a1a1a,#3a0b0b)}
.pf-instagram{background:linear-gradient(135deg,#3b1c5a,#a0275e 55%,#e0812b)}
.pf-pinterest{background:linear-gradient(135deg,#5c0b12,#b5172a)}
.pf-tiktok{background:linear-gradient(135deg,#0d0d0d,#1d3a3f 60%,#4a1530)}
.pf-spotify{background:linear-gradient(135deg,#0d2416,#1c6b3a)}
.pf-web{background:linear-gradient(135deg,#202020,#4b4b4b)}
.pf-vimeo{background:linear-gradient(135deg,#0d2533,#1d6c8f)}
.tload .card{aspect-ratio:4/5;background:var(--soft);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;color:var(--ink3);font-size:12.5px}
.spin{width:22px;height:22px;border-radius:50%;border:2px solid var(--line2);border-top-color:var(--ink);animation:rot .8s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}

/* tile de agregar */
.addt .card{background:transparent;box-shadow:none;border:1.5px dashed var(--line2);cursor:default;padding:14px;display:flex;flex-direction:column;gap:10px}
.tile.addt:hover .card{box-shadow:none;border-color:var(--ink3)}
.addt .ex{font-size:13px;color:var(--ink3);line-height:1.4;padding:2px 2px 0}
.addt .ex em{font-family:var(--serif);font-size:16px;color:var(--ink2)}
.addg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.addg button{height:46px;border-radius:10px;background:var(--paper);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;gap:7px;font-size:13.5px;font-weight:600;transition:border-color .15s,background .15s}
.addg button:hover{border-color:var(--ink)}
.addg button.main{background:var(--ink);color:#fff;border-color:var(--ink);grid-column:1/-1}
.addg button:not(.main){flex-direction:column;gap:2px;height:54px;font-size:12px}
.addt.empty{grid-column:1/-1}
.addt.empty .card{flex-direction:row;align-items:center;gap:22px;padding:18px 18px 18px 22px;min-height:96px}
.addt.empty .ex{flex:1;font-size:14px}
.addt.empty .ex em{font-size:20px}
.addt.empty .addg{grid-template-columns:auto auto auto auto;flex:none}
.addt.empty .addg button{height:46px;padding:0 16px;flex-direction:row;gap:7px;font-size:13.5px}
.addt.empty .addg button.main{grid-column:auto}
.addt.empty .tip{display:none}
.addg button.main:hover{background:#2a2a2a}
.addt .tip{font-size:11.5px;color:var(--ink3);text-align:center}
.sec.pulse .addg button.main{animation:glow 1.6s ease-in-out 3}
@keyframes glow{50%{box-shadow:0 0 0 6px rgba(17,17,17,.12)}}

/* arrastre */
body.dragging,body.dragging *{cursor:grabbing!important}
.tile.ph .card{opacity:.25;box-shadow:none;outline:2px dashed var(--ink3);outline-offset:-2px}
.dragghost{position:fixed;left:0;top:0;z-index:100;pointer-events:none;margin:0}
.dragghost .card{box-shadow:0 10px 24px rgba(0,0,0,.18),0 30px 70px rgba(0,0,0,.22);transform:rotate(2deg) scale(1.03)}
.dragghost .acts{display:none}

.addsec{margin:30px 0 0 38px;padding:22px;border:1.5px dashed var(--line2);border-radius:18px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.addsec>span{font-size:13px;color:var(--ink3);margin-right:4px}
.addsec .btn.line{height:38px}

/* ── modales / hojas ── */
.scrim{position:fixed;inset:0;background:rgba(17,17,17,.42);z-index:80;display:flex;align-items:center;justify-content:center;padding:24px;opacity:0;transition:opacity .2s}
.scrim.on{opacity:1}
.sheet{background:var(--paper);border-radius:22px;box-shadow:var(--sh2);width:min(560px,100%);max-height:calc(100vh - 48px);display:flex;flex-direction:column;transform:translateY(12px) scale(.98);transition:transform .25s cubic-bezier(.2,.8,.2,1);overflow:hidden}
.sheet.wide{width:min(980px,100%)}
.scrim.on .sheet{transform:none}
.shd{display:flex;align-items:center;gap:12px;padding:18px 20px 6px 24px}
.shd h2{font-size:18px;font-weight:600;letter-spacing:-.01em;flex:1}
.shd p{font-size:13px;color:var(--ink3)}
.shb{padding:10px 24px 8px;overflow:auto}
.shf{display:flex;gap:10px;justify-content:flex-end;padding:14px 20px 18px;border-top:1px solid var(--line);margin-top:10px;flex-wrap:wrap;align-items:center}
.shf .sp{flex:1}
.fl{display:block;font-size:13px;font-weight:600;margin:14px 0 6px}
.fl small{font-weight:400;color:var(--ink3)}
.inp{width:100%;height:46px;border:1px solid var(--line2);border-radius:12px;padding:0 14px;background:#fff;outline:none;font-size:15px;transition:border-color .15s,box-shadow .15s}
textarea.inp{height:auto;min-height:96px;padding:12px 14px;resize:vertical;line-height:1.45}
.inp:focus{border-color:var(--ink);box-shadow:0 0 0 3px rgba(17,17,17,.08)}
.drop{border:1.5px dashed var(--line2);border-radius:16px;padding:30px 18px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px;transition:border-color .15s,background .15s;cursor:pointer;background:#fcfbf9}
.drop:hover,.drop.on{border-color:var(--ink);background:var(--soft)}
.drop svg{width:30px;height:30px}
.drop b{font-size:16px}
.drop span{font-size:13px;color:var(--ink3)}
.or{display:flex;align-items:center;gap:12px;color:var(--ink3);font-size:12px;margin:16px 0 4px}
.or:before,.or:after{content:"";height:1px;background:var(--line);flex:1}
.row{display:flex;gap:8px;align-items:center}
.row .inp{flex:1}
.bigsw{height:120px;border-radius:16px;border:1px solid rgba(0,0,0,.06);display:flex;align-items:flex-end;padding:14px;font-family:var(--mono);font-size:14px;transition:background .15s}
.cpick{position:relative;width:46px;height:46px;border-radius:12px;overflow:hidden;border:1px solid var(--line2);flex:none}
.cpick input{position:absolute;inset:-8px;width:calc(100% + 16px);height:calc(100% + 16px);border:0;padding:0;cursor:pointer}
.thumbs{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px}
.thumbs button{flex:none;width:64px;height:64px;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:var(--soft) center/cover}
.thumbs button:hover{outline:2px solid var(--ink)}
.qs{display:flex;gap:6px;flex-wrap:wrap}
.qs button{width:34px;height:34px;border-radius:9px;border:1px solid rgba(0,0,0,.08)}
.qs button:hover{transform:scale(1.08)}
.pickwrap{position:relative;border-radius:14px;overflow:hidden;background:#111;display:flex;justify-content:center;touch-action:none}
.pickwrap canvas{display:block;max-width:100%;max-height:52vh;cursor:crosshair}
.loupe{position:absolute;width:64px;height:64px;border-radius:50%;border:3px solid #fff;box-shadow:0 4px 14px rgba(0,0,0,.4);pointer-events:none;display:none;transform:translate(-50%,-120%)}
.pickinfo{display:flex;align-items:center;gap:12px;margin-top:12px;font-size:13px;color:var(--ink2)}
.pickinfo i{width:40px;height:40px;border-radius:10px;border:1px solid rgba(0,0,0,.08);flex:none}
.pickinfo b{font-family:var(--mono);font-weight:500}
.note{font-size:13px;color:var(--ink2);background:var(--soft);border-radius:12px;padding:12px 14px;line-height:1.45;margin-top:10px}
.note.warn{background:#fbefe6;color:#7a3511}
.edprev{border-radius:14px;overflow:hidden;background:var(--soft);display:flex;justify-content:center}
.edprev img{max-height:46vh;width:auto}
.lprev{margin-top:12px}
.lprev .tile{max-width:280px}
.dangerb{color:#b3261e}
.dangerb:hover{background:#fbeceb!important}
select.inp{appearance:auto}

/* popover paleta */
.pop{position:fixed;z-index:90;background:var(--paper);border:1px solid var(--line);border-radius:14px;box-shadow:var(--sh2);padding:6px;width:230px;animation:pop .14s ease-out}
.pop .pv{height:54px;border-radius:10px;margin:2px 2px 6px;display:flex;align-items:flex-end;padding:8px;font-family:var(--mono);font-size:13px}
.pop button{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border-radius:9px;font-size:14px;text-align:left;min-height:42px}
.pop button:hover{background:var(--soft)}

/* toast */
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:var(--ink);color:#fff;border-radius:999px;padding:0 8px 0 18px;height:46px;display:flex;align-items:center;gap:12px;font-size:14px;z-index:120;opacity:0;pointer-events:none;transition:opacity .2s,transform .25s cubic-bezier(.2,.8,.2,1);box-shadow:var(--sh2);max-width:calc(100vw - 32px)}
.toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-right:10px}
.toast button{height:34px;padding:0 14px;border-radius:999px;background:#2c2c2c;font-weight:600;font-size:13px;color:#fff}
.toast button:hover{background:#3a3a3a}

/* ayuda */
.help .q{border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
.help .q h4{font-size:15px;font-weight:600;margin-bottom:4px}
.help .q p{font-size:13px;color:var(--ink3);margin-bottom:10px}
.help .q p em{font-family:var(--serif);font-size:16px;color:var(--ink2)}
.help .q .row{align-items:stretch}
.help .q .inp{height:44px}
.help .lead{font-size:14px;color:var(--ink2);margin-bottom:16px}
.help .tips{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:6px 0 16px}
.help .tips div{background:var(--soft);border-radius:12px;padding:12px;font-size:13px;color:var(--ink2)}
.help .tips b{display:block;color:var(--ink);font-size:13px;margin-bottom:2px}
.help .q.done{border-color:var(--ok)}
.help .q.done h4:after{content:" ✓";color:var(--ok)}

/* ── bienvenida ── */
.welcome{min-height:calc(100vh - 64px);display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:56px;align-items:center;max-width:1240px;margin:0 auto;padding:40px 24px 60px}
.welcome h1{font-family:var(--serif);font-weight:400;font-size:clamp(46px,6.2vw,88px);line-height:.95;letter-spacing:-.02em;margin:16px 0 18px}
.welcome h1 em{font-style:italic;color:var(--ink3)}
.welcome .lead{font-size:17px;color:var(--ink2);max-width:520px}
.steps3{display:flex;gap:18px;margin:26px 0 26px;flex-wrap:wrap}
.steps3 div{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;color:var(--ink2);max-width:170px;line-height:1.35}
.steps3 b{width:24px;height:24px;border-radius:50%;background:var(--ink);color:#fff;font-size:12px;display:flex;align-items:center;justify-content:center;flex:none}
.tchips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 6px}
.tchips button{height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line2);display:inline-flex;align-items:center;gap:8px;font-size:14px;background:var(--paper);transition:all .15s}
.tchips button .ck{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--line2);display:flex;align-items:center;justify-content:center}
.tchips button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.tchips button.on .ck{background:#fff;border-color:#fff}
.tchips button.on .ck:after{content:"";width:6px;height:6px;border-radius:50%;background:var(--ink)}
.wfoot{display:flex;gap:12px;align-items:center;margin-top:22px;flex-wrap:wrap}
.wfoot small{color:var(--ink3);font-size:13px}
.mmnote{margin-top:16px;display:flex;gap:10px;align-items:center;font-size:13px;color:var(--ok);background:#e9f3ec;border-radius:12px;padding:10px 12px}
.mmnote .sws{display:flex}
.mmnote .sws i{width:16px;height:16px;border-radius:50%;border:2px solid #e9f3ec;margin-left:-5px}
.collagep{position:relative;aspect-ratio:1/1.02;max-width:520px;width:100%;justify-self:center}
.collagep .c{position:absolute;border-radius:14px;box-shadow:var(--sh2);overflow:hidden}
.collagep .c1{left:4%;top:6%;width:46%;height:56%;background:radial-gradient(120% 90% at 30% 20%,#ff6a3d 0,#7a1f3d 38%,#14101e 75%)}
.collagep .c1:after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,.04) 0 2px,transparent 2px 4px)}
.collagep .c2{right:4%;top:0;width:42%;height:36%;background:linear-gradient(160deg,#d8d2c4,#9c9483)}
.collagep .c3{right:6%;top:40%;width:38%;height:30%;background:#fff;padding:18px;font-family:var(--serif);font-size:clamp(18px,2.2vw,26px);line-height:1.15;display:flex;align-items:flex-end}
.collagep .c4{left:12%;bottom:4%;width:34%;height:28%;display:grid;grid-template-columns:repeat(3,1fr)}
.collagep .c5{left:50%;bottom:0;width:40%;height:24%;background:linear-gradient(120deg,#0e1830,#2d4c7a 60%,#86a4c8)}
.collagep .tag{position:absolute;font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3)}

/* ── exportar ── */
.expgrid{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:22px;align-items:start}
.expview{background:#e8e6e0;border-radius:16px;padding:18px;display:flex;align-items:center;justify-content:center;min-height:360px;overflow:hidden}
.expview .scaler{transform-origin:top left;box-shadow:0 10px 40px rgba(0,0,0,.25)}
.seg{display:flex;background:var(--soft);border-radius:12px;padding:4px;gap:4px}
.seg button{flex:1;height:40px;border-radius:9px;font-size:13.5px;font-weight:600;color:var(--ink2)}
.seg button.on{background:var(--paper);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.expside .fl{margin-top:0}
.expside>div{margin-bottom:18px}
.expside .btn{width:100%}

/* lámina (se usa en exportar, imprimir) */
.sheetx{position:relative;overflow:hidden;font-family:var(--sans);--sx-bg:#f6f4ef;--sx-ink:#121212;--sx-ink2:#5b5850;--sx-line:#dcd8cf}
.sheetx.dark{--sx-bg:#0f0f0f;--sx-ink:#f4f2ec;--sx-ink2:#9a968d;--sx-line:#2b2b2b}
.sheetx{background:var(--sx-bg);color:var(--sx-ink)}
.sheetx .x-eb{font-size:22px;letter-spacing:.32em;text-transform:uppercase;font-weight:600;color:var(--sx-ink2);display:flex;justify-content:space-between}
.sheetx .x-name{font-family:var(--serif);font-weight:400;letter-spacing:-.02em;line-height:1.02;word-break:break-word;padding-bottom:6px}
.sheetx .x-gen{font-size:24px;color:var(--sx-ink2);padding-top:18px}
.sheetx .x-words{font-family:var(--serif);font-style:italic;line-height:1.08}
.sheetx .x-words span{display:block}
.sheetx .x-pal{display:flex;gap:10px}
.sheetx .x-pal div{flex:1;display:flex;flex-direction:column;gap:12px}
.sheetx .x-pal i{display:block;border-radius:10px;border:1px solid rgba(128,128,128,.18)}
.sheetx .x-pal b{font-family:var(--mono);font-weight:500;font-size:17px;color:var(--sx-ink2);letter-spacing:.02em}
.sheetx .x-foot{font-size:17px;color:var(--sx-ink2);display:flex;justify-content:space-between;letter-spacing:.04em}
.sheetx .x-col{display:grid;gap:12px}
.sheetx .x-col>div{border-radius:10px;background-size:cover;background-position:center;overflow:hidden;position:relative}
.sheetx .x-col .x-q{background:var(--sx-ink);color:var(--sx-bg);padding:28px;font-family:var(--serif);font-size:38px;line-height:1.12;display:flex;align-items:flex-end}
.sheetx .x-col .x-c{display:flex;align-items:flex-end;padding:16px;font-family:var(--mono);font-size:17px}
.sheetx.h{width:1920px;height:1080px;padding:72px;display:grid;grid-template-columns:600px 1fr;gap:64px}
.sheetx.h .x-left{display:flex;flex-direction:column;min-height:0}
.sheetx.h .x-words{font-size:50px;padding-top:34px}
.sheetx.h .x-pal{margin-top:auto}
.sheetx.h .x-pal i{height:150px}
.sheetx.h .x-foot{margin-top:30px}
.sheetx.h .x-col{grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(3,1fr);height:936px}
.sheetx.v{width:1080px;height:1920px;padding:72px 64px 64px;display:flex;flex-direction:column}
.sheetx.v .x-words{font-size:46px;padding-top:26px;display:flex;flex-wrap:wrap;gap:0 22px}
.sheetx.v .x-words span{display:inline}
.sheetx.v .x-col{grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(4,1fr);flex:1;margin:44px 0 36px;min-height:0}
.sheetx.v .x-pal i{height:110px}
.sheetx.v .x-foot{margin-top:32px}
.sheetx .x-big{grid-column:span 2;grid-row:span 2}

/* ── presentación ── */
.pres{position:fixed;inset:0;z-index:150;background:#0b0b0b;color:#f4f2ec;display:flex;flex-direction:column;opacity:0;transition:opacity .25s}
.pres.on{opacity:1}
.pres .pbar{display:flex;align-items:center;gap:12px;padding:16px 22px;font-size:13px;color:#8c8880}
.pres .pbar .sp{flex:1}
.pres .pbar button{width:44px;height:44px;border-radius:50%;color:#d8d5ce;display:flex;align-items:center;justify-content:center}
.pres .pbar button:hover{background:#1e1e1e}
.pres .stage{flex:1;position:relative;overflow:hidden}
.slide{position:absolute;inset:0;padding:10px 6vw 4vh;display:flex;flex-direction:column;opacity:0;transform:translateX(30px);transition:opacity .4s,transform .5s cubic-bezier(.2,.8,.2,1);pointer-events:none}
.slide.on{opacity:1;transform:none;pointer-events:auto}
.slide.prev{transform:translateX(-30px)}
.slide .k{font-family:var(--mono);font-size:13px;color:#8c8880;letter-spacing:.06em}
.slide h2{font-family:var(--serif);font-weight:400;font-size:clamp(40px,6vw,96px);line-height:.95;letter-spacing:-.02em;margin:10px 0 3vh}
.slide.cover{justify-content:center}
.slide.cover h2{font-size:clamp(64px,12vw,200px);margin:14px 0 2vh}
.slide.cover .w{font-family:var(--serif);font-style:italic;font-size:clamp(24px,3.4vw,52px);color:#cfcbc2}
.slide.cover .pbars{display:flex;height:12vh;margin-top:6vh;border-radius:12px;overflow:hidden;max-width:1100px}
.slide.cover .pbars div{flex:1;display:flex;align-items:flex-end;padding:10px;font-family:var(--mono);font-size:12px}
.pgal{flex:1;display:grid;gap:12px;min-height:0}
.pgal>*{border-radius:10px;overflow:hidden;min-height:0;min-width:0;width:100%;height:100%}
.pgal img{width:100%;height:100%;object-fit:cover;aspect-ratio:auto!important}
.pgal .pc{display:flex;align-items:flex-end;padding:14px;font-family:var(--mono);font-size:14px}
.pgal .pq{background:#f4f2ec;color:#111;padding:6%;font-family:var(--serif);font-size:clamp(20px,2.4vw,40px);line-height:1.12;display:flex;align-items:flex-end}
.pgal .pl{position:relative;background:#222;display:flex;align-items:flex-end;padding:14px;font-weight:600;color:#fff;text-decoration:none}
.pgal .pl img{position:absolute;inset:0}
.pgal .pl span{position:relative;background:rgba(0,0,0,.55);padding:6px 10px;border-radius:8px;font-size:14px}
.pres .nav{position:absolute;top:0;bottom:0;width:18%;z-index:2}
.pres .nav.l{left:0;cursor:w-resize}.pres .nav.r{right:0;cursor:e-resize}
.pres .dots{display:flex;gap:6px}
.pres .dots i{width:6px;height:6px;border-radius:50%;background:#3a3a3a;transition:background .2s,width .2s}
.pres .dots i.on{background:#f4f2ec;width:18px;border-radius:4px}

.printonly{display:none}
@media print{
  @page{size:A4 landscape;margin:10mm}
  body{background:#fff;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .sec.vacia{display:none}
  .top,.addt,.acts,.addsec,.sacts,.sugg,.wordin,.prog,.toast,.scrim,.pop,.palnote,.ph button,.shint,#pres{display:none!important}
  .printonly{display:block;page-break-after:always}
  .printonly .sheetx{zoom:.54}
  .hero{grid-template-columns:1fr 1fr;padding-top:0}
  .panel{box-shadow:none}
  .card{box-shadow:none;border:1px solid #ddd}
  .sec{break-inside:avoid-page}
  .grid{margin-left:0}
  .tile{break-inside:avoid}
}

/* ── celular ── */
@media (max-width:860px){
  .hero{grid-template-columns:1fr;gap:22px;padding-top:26px}
  .welcome{grid-template-columns:1fr;gap:28px;padding-top:24px;min-height:0}
  .collagep{max-width:360px;order:-1;aspect-ratio:1/.8}
  .expgrid{grid-template-columns:1fr}
}
@media (max-width:600px){
  body{font-size:15px}
  .top .in{padding:0 12px;height:58px;gap:4px}
  .brand .sl,.brand .pn,.save .tx{display:none}
  .save{padding:0 8px}
  .top .btn.hide-s{display:none}
  .top .btn.dark{padding:0 14px}
  .wrap{padding:0 16px}
  .ttl{font-size:50px}
  .sub{font-size:15px}
  .panel{padding:16px;border-radius:16px}
  .pal{grid-template-columns:repeat(3,1fr)}
  .sw{height:64px}
  .secs{padding-top:10px}
  .sec{padding-top:24px}
  .sh{gap:8px}
  .sn{display:none}
  .st{font-size:28px}
  .scount{display:none}
  .shint{margin-left:0;font-size:13.5px}
  .grid{margin-left:0;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:10px}
  .tile .tin{padding-bottom:10px}
  .addsec{margin-left:0;padding:16px}
  .tcolor .swb{height:110px}
  .ttext q{font-size:19px}
  .ttext .card{padding:18px 16px 16px}
  .addg button{height:44px;font-size:13px}
  .addt.empty .card{flex-direction:column;align-items:stretch;gap:12px;padding:16px}
  .addt.empty .addg{grid-template-columns:repeat(3,1fr)}
  .addt.empty .addg button.main{grid-column:1/-1}
  .addt.empty .addg button:not(.main){flex-direction:column;gap:2px;height:54px;padding:0;font-size:12px}
  .scrim{padding:0;align-items:flex-end}
  .sheet{width:100%;border-radius:22px 22px 0 0;max-height:92vh;transform:translateY(40px)}
  .shd{padding:16px 16px 4px 20px}
  .shb{padding:8px 20px 6px}
  .shf{padding:12px 16px calc(14px + env(safe-area-inset-bottom))}
  .shf .btn{flex:1}
  .shf .sp{display:none}
  .help .tips{grid-template-columns:1fr}
  .welcome h1{font-size:48px}
  .steps3{gap:12px}
  .steps3 div{max-width:none;flex:1 1 100%}
  .wfoot .btn{width:100%}
  .expview{min-height:240px;padding:12px}
  .slide{padding:6px 5vw 3vh}
  .pres .nav{width:28%}
  .pres .pbar>span:first-child{display:none}
  .pres .pbar{padding:10px 12px}
  .prog .bar{flex-basis:90px}
}
</style>
</head>
<body>
<header class="top" id="top">
  <div class="in">
    <div class="brand"><div class="mark" aria-hidden="true"><i></i><i></i><i></i><i></i></div><span>Moodboard</span><span class="sl">/</span><span class="pn" id="topName"></span></div>
    <div class="sp"></div>
    <span class="save" id="save" role="status" aria-live="polite"><i></i><span class="tx" id="saveTx">Listo</span></span>
    <button class="btn ghost hide-s" id="bHelp" hidden><svg class="i"><use href="#i-help"/></svg>¿Por dónde empiezo?</button>
    <button class="ib" id="bHelpS" aria-label="Ayuda: por dónde empezar" hidden><svg class="i"><use href="#i-help"/></svg></button>
    <button class="ib" id="bPres" aria-label="Modo presentación" title="Presentar" hidden><svg class="i"><use href="#i-play"/></svg></button>

      <button class="btn dark" id="bExp" aria-haspopup="true" aria-expanded="false"><svg class="i"><use href="#i-down"/></svg><span>Exportar</span></button>

        <button data-exp="pres" role="menuitem"><svg class="i"><use href="#i-play"/></svg><span><b>Presentar en pantalla completa</b><small>Para mostrárselo a Larry en la llamada</small></span></button>
      </div>
    </div>
  </div>
</header>

<div class="printonly" id="printSheet"></div>
<main id="app"></main>
<div class="toast" id="toast" role="status" aria-live="polite"><span id="toastTx"></span><button id="toastBtn" hidden>Deshacer</button></div>
<input type="file" id="fileIn" accept="image/*" multiple class="sr" tabindex="-1" aria-hidden="true">

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>

    <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></symbol>
    <symbol id="i-pin" viewBox="0 0 24 24"><path d="M9 4h6l-1 6 4 3v1H6v-1l4-3-1-6zM12 14v7"/></symbol>
    <symbol id="i-pinf" viewBox="0 0 24 24"><path d="M9 4h6l-1 6 4 3v1H6v-1l4-3-1-6z" fill="currentColor"/><path d="M12 14v7"/></symbol>

/* ── colores ── */
const hexOk = h => /^#?[0-9a-f]{6}$/i.test(String(h || '').trim()) || /^#?[0-9a-f]{3}$/i.test(String(h || '').trim());
function normHex(h) {

}
const toRgb = h => { h = normHex(h).slice(1); return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)]; };
const toHex = (r, g, b) => '#' + [r, g, b].map(v => Math.max(0, Math.min(255, Math.round(v))).toString(16).padStart(2, '0')).join('').toUpperCase();

/* ── imágenes: carga con CORS y muestreo ── */
function imgTag(url, alt, cls) {
  const ar = ASPECT.get(url);
  const st = ar ? ` style="aspect-ratio:${ar}"` : '';
  const co = CORS_BAD.has(url) || /^data:/.test(url) ? '' : ' crossorigin="anonymous"';
  return `<img${co} src="${esc(url)}" alt="${esc(alt || '')}" draggable="false" loading="lazy" decoding="async" data-u="${esc(url)}"${st}${cls ? ` class="${cls}"` : ''}>`;
}
// si una imagen falla con CORS, reintenta sin CORS (se ve, pero no sirve para paleta/exportar)
document.addEventListener('error', e => {
  const im = e.target;
  if (!(im instanceof HTMLImageElement) || !im.dataset.u) return;
  if (im.hasAttribute('crossorigin')) {
    CORS_BAD.add(im.dataset.u); im.removeAttribute('crossorigin'); im.src = im.dataset.u;
  } else if (!im.dataset.dead) {
    im.dataset.dead = 1; im.alt = 'No se pudo cargar la imagen'; im.style.minHeight = '120px';
  }
}, true);
document.addEventListener('load', e => {
  const im = e.target;
  if (!(im instanceof HTMLImageElement) || !im.dataset.u || !im.naturalWidth) return;
  const ar = +(im.naturalWidth / im.naturalHeight).toFixed(4);
  if (!ASPECT.has(im.dataset.u)) { ASPECT.set(im.dataset.u, ar); im.style.aspectRatio = ar; }
}, true);

function loadImg(url, cors) {
  return new Promise(res => {
    const im = new Image();
    if (cors && !/^data:/.test(url)) im.crossOrigin = 'anonymous';
    im.onload = () => res(im); im.onerror = () => res(null); im.src = url;
  });
}
async function sampleImg(url) {
  if (PIX.has(url)) return PIX.get(url);

    if (CORS_BAD.has(url)) return null;
    const im = await loadImg(url, true);
    if (!im) { CORS_BAD.add(url); return null; }
    ASPECT.set(url, +(im.naturalWidth / im.naturalHeight).toFixed(4));
    try {
      const k = 56 / Math.max(im.naturalWidth, im.naturalHeight);
      const c = document.createElement('canvas'); c.width = Math.max(1, Math.round(im.naturalWidth * k)); c.height = Math.max(1, Math.round(im.naturalHeight * k));

      for (let i = 0; i < d.length; i += 4) if (d[i + 3] > 200) out.push([d[i], d[i + 1], d[i + 2]]);

/* ── paleta automática: k-means en RGB con semilla fija ── */
function kmeans(px, k) {
  if (px.length <= k) return px.map(p => ({ c: p, n: 1 }));
  let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const d2 = (a, b) => (a[0] - b[0]) ** 2 + (a[1] - b[1]) ** 2 + (a[2] - b[2]) ** 2;
  const C = [px[Math.floor(rnd() * px.length)].slice()];
  while (C.length < k) { // k-means++
    const ds = px.map(p => Math.min(...C.map(c => d2(p, c)))); const sum = ds.reduce((a, b) => a + b, 0);
    let r = rnd() * sum, i = 0; while (i < ds.length - 1 && (r -= ds[i]) > 0) i++; C.push(px[i].slice());
  }
  let as = new Array(px.length).fill(0);
  for (let it = 0; it < 14; it++) {
    const acc = C.map(() => [0, 0, 0, 0]);
    for (let i = 0; i < px.length; i++) {
      let b = 0, bd = Infinity; for (let j = 0; j < k; j++) { const d = d2(px[i], C[j]); if (d < bd) { bd = d; b = j; } }
      as[i] = b; const a = acc[b]; a[0] += px[i][0]; a[1] += px[i][1]; a[2] += px[i][2]; a[3]++;
    }
    acc.forEach((a, j) => { if (a[3]) C[j] = [a[0] / a[3], a[1] / a[3], a[2] / a[3]]; });
  }

}
function pickDistinct(clusters, max, avoid) {

  for (const x of ranked) {
    if (out.length >= max) break;

async function computePalette() {

function linkInfo(url) {

  if (/tiktok\.com/.test(h)) return { pf: 'tiktok', host: 'TikTok', label: 'TikTok', icon: 'tt' };

function renderPalette() {

    } else cells.push(`<button class="sw empty" data-add="1" aria-label="Agregar color a la paleta">${ico('plus')}</button>`);
  }
  el.innerHTML = cells.join('');

function palPopover(anchor, c) {
  closePop();
  const fixed = S.fijos.includes(c);
  const p = document.createElement('div'); p.className = 'pop'; p.id = 'pop';
  p.innerHTML = `<div class="pv" style="background:${c};color:${fgOn(c)}">${c}</div>
    <button data-a="copy">${ico('copy')}Copiar ${c}</button>
    <button data-a="pin">${ico(fixed ? 'pin' : 'pinf')}${fixed ? 'Soltar (que se recalcule)' : 'Fijar este color'}</button>
    <button data-a="edit">${ico('edit')}Cambiar color</button>
    <button data-a="add">${ico('plus')}Sumar a «Colores»</button>
    ${fixed ? `<button data-a="del" class="dangerb">${ico('trash')}Quitar de la paleta</button>` : ''}`;
  document.body.appendChild(p);
  const r = anchor.getBoundingClientRect(); const pw = 230, ph = p.offsetHeight;
  let x = Math.min(innerWidth - pw - 10, Math.max(10, r.left + r.width / 2 - pw / 2));
  let y = r.bottom + 8; if (y + ph > innerHeight - 10) y = Math.max(10, r.top - ph - 8);
  p.style.left = x + 'px'; p.style.top = y + 'px';
  p.onclick = e => {
    const a = e.target.closest('button'); if (!a) return; closePop();
    const act = a.dataset.a;
    if (act === 'copy') copyText(c);
    if (act === 'pin') { if (fixed) S.fijos = S.fijos.filter(x => x !== c); else S.fijos.push(c); changed({ palette: true }); renderPalette(); toast(fixed ? 'Color suelto' : 'Color fijado'); }
    if (act === 'edit') openColorSheet({ mode: 'palette', replace: c, color: c });
    if (act === 'del') { S.fijos = S.fijos.filter(x => x !== c); S.paleta = S.paleta.filter(x => x !== c); changed({ palette: true }); renderPalette(); }
    if (act === 'add') { const sec = ensureSection('colores'); sec.items.push({ id: uid(), tipo: 'color', color: c }); changed(); renderSections(); toast('Sumado a «' + sec.titulo + '»'); }
  };
  setTimeout(() => document.addEventListener('pointerdown', popOut, true), 0);
}
function popOut(e) { if (!e.target.closest('#pop')) closePop(); }
function closePop() { const p = $('#pop'); if (p) p.remove(); document.removeEventListener('pointerdown', popOut, true); }

function renderWords() {

function updateProgress() {
  const el = $('#prog'); if (!el || !S) return;
  const n = S.secciones.reduce((a, s) => a + s.items.length, 0);
  const full = S.secciones.filter(s => s.items.length >= 3).length;
  const pct = Math.round(100 * Math.min(1, (Math.min(full, 5) / 5) * .7 + (Math.min(S.palabras.length, 3) / 3) * .15 + (Math.min(S.paleta.length, 5) / 5) * .15));

/* ── masonry: cada tile ocupa filas de 2px según su alto ── */
const ro = new ResizeObserver(ents => ents.forEach(e => spanOf(e.target.parentElement)));
function spanOf(tile) { if (!tile || !tile.firstElementChild) return; const h = tile.firstElementChild.getBoundingClientRect().height; tile.style.gridRowEnd = 'span ' + Math.max(1, Math.ceil(h / 2)); }

function findItem(id) {

}

function openAdd(kind, sid) {
  if (kind === 'img') return openImageSheet(sid);
  if (kind === 'color') return openColorSheet({ mode: 'add', sid });
  if (kind === 'texto') return openTextSheet({ sid });
  if (kind === 'link') return openLinkSheet({ sid });
}

// subida de archivos (con tarjetas "Subiendo…")
async function addFiles(files, sid) {
  files = Array.from(files || []).filter(f => /^image\//.test(f.type));
  if (!files.length) return toast('Eso no parece una imagen');
  const sec = S.secciones.find(s => s.id === sid) || S.secciones[0]; if (!sec) return;
  const temps = files.map(() => ({ id: uid(), tipo: 'img', _loading: true }));
  sec.items.push(...temps); renderSections();
  let ok = 0;
  await Promise.all(files.map(async (f, k) => {
    try { const url = await AOS.upload(f, f.name); Object.assign(temps[k], { url }); delete temps[k]._loading; ok++; }
    catch (e) { sec.items = sec.items.filter(x => x !== temps[k]); }
  }));
  changed({ palette: true }); renderSections();
  toast(ok ? `${ok} ${ok === 1 ? 'imagen agregada' : 'imágenes agregadas'} a «${sec.titulo}»` : 'No se pudo subir. Probá de nuevo.');
}
// imagen desde link: intenta copiarla a tu carpeta (así sirve para paleta y exportar)
async function addImageUrl(url, sid) {
  const sec = S.secciones.find(s => s.id === sid) || S.secciones[0];
  const temp = { id: uid(), tipo: 'img', _loading: true }; sec.items.push(temp); renderSections();
  let final = url;
  try {
    const c = new AbortController(); const tm = setTimeout(() => c.abort(), 8000);
    const r = await fetch(url, { mode: 'cors', signal: c.signal }); clearTimeout(tm);
    const b = await r.blob(); if (r.ok && /^image\//.test(b.type)) final = await AOS.upload(b, 'link-' + Date.now());
  } catch (e) { /* esa web no deja copiarla: queda el link */ }
  const im = await loadImg(final, false);
  if (!im) { sec.items = sec.items.filter(x => x !== temp); renderSections(); return toast('Ese link no es una imagen. Lo podés agregar como Link.'); }
  Object.assign(temp, { url: final }); delete temp._loading;
  changed({ palette: true }); renderSections(); toast('Imagen agregada a «' + sec.titulo + '»');
}
function openImageSheet(sid) {
  const sh = openSheet({ title: 'Agregar imágenes', sub: 'a «' + secTitle(sid) + '»', body: `
    <label class="drop" id="dz" tabindex="0">${ico('img')}<b>Elegí fotos de tu ${isMobile() ? 'celu' : 'compu'}</b><span>Podés elegir varias juntas. JPG, PNG, capturas de pantalla.</span></label>
    <div class="or">o pegá el link de una imagen</div>
    <div class="row"><input class="inp" id="imgUrl" placeholder="https://…/foto.jpg" inputmode="url"><button class="btn dark" id="imgUrlGo">Agregar</button></div>
    <p class="note">${isMobile() ? 'Tip: en Pinterest o Instagram, sacale captura de pantalla a lo que te guste y subila desde acá.' : 'Tip: también podés arrastrar fotos directo al tablero, o copiar una imagen y apretar Ctrl+V.'}</p>`,
    foot: `<button class="btn ghost" data-close>Cancelar</button>` });
  const dz = $('#dz', sh);
  dz.onclick = e => { e.preventDefault(); pickFiles(sid); closeSheet(); };
  dz.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); dz.click(); } };

  const go = () => { const u = $('#imgUrl', sh).value.trim(); if (!isUrl(u)) return toast('Pegá un link que empiece con https://'); closeSheet(); addImageUrl(u, sid); };
  $('#imgUrlGo', sh).onclick = go; $('#imgUrl', sh).onkeydown = e => { if (e.key === 'Enter') go(); };
}

/* cuentagotas sobre una imagen */
function openPicker(url, cb) {
  const sh = openSheet({ title: 'Tocá el color que querés', sub: 'Mové el dedo o el mouse y soltá sobre el punto exacto', wide: true, body: `
    <div class="pickwrap" id="pw"><canvas id="pc"></canvas><div class="loupe" id="lp"></div></div>
    <div class="pickinfo"><i id="pi"></i><span>Color: <b id="ph">—</b></span></div>
    <p class="note warn" id="pwarn" hidden>Esta imagen viene de otra web y no deja tomar colores. Bajala y subila desde tu celu o compu para usar el cuentagotas.</p>`,
    foot: `<button class="btn ghost" id="pBack">Volver</button><button class="btn dark" id="pOk" disabled>Usar este color</button>` });
  let cur = null; const cv = $('#pc', sh), lp = $('#lp', sh);
  $('#pBack', sh).onclick = () => cb(null);
  loadImg(url, true).then(im => {
    if (!im) { $('#pwarn', sh).hidden = false; return; }
    const maxW = Math.min(900, sh.clientWidth - 48), maxH = innerHeight * .52;
    const k = Math.min(1, maxW / im.naturalWidth, maxH / im.naturalHeight);
    cv.width = Math.round(im.naturalWidth * k); cv.height = Math.round(im.naturalHeight * k);
    const x = cv.getContext('2d', { willReadFrequently: true }); x.drawImage(im, 0, 0, cv.width, cv.height);
    try { x.getImageData(0, 0, 1, 1); } catch (e) { $('#pwarn', sh).hidden = false; return; }
    const at = e => {
      const r = cv.getBoundingClientRect(); const px = (e.clientX - r.left) * cv.width / r.width, py = (e.clientY - r.top) * cv.height / r.height;
      if (px < 0 || py < 0 || px >= cv.width || py >= cv.height) return;
      const d = x.getImageData(Math.floor(px), Math.floor(py), 1, 1).data; cur = toHex(d[0], d[1], d[2]);
      $('#pi', sh).style.background = cur; $('#ph', sh).textContent = cur; $('#pOk', sh).disabled = false;
      const wr = $('#pw', sh).getBoundingClientRect(); lp.style.display = 'block'; lp.style.left = (e.clientX - wr.left) + 'px'; lp.style.top = (e.clientY - wr.top) + 'px'; lp.style.background = cur;
    };
    let down = false;
    cv.onpointerdown = e => { down = true; cv.setPointerCapture(e.pointerId); at(e); };
    cv.onpointermove = e => { if (down || e.pointerType === 'mouse') at(e); };
    cv.onpointerup = () => { down = false; setTimeout(() => lp.style.display = 'none', 500); };
    cv.onpointerleave = () => { if (!down) lp.style.display = 'none'; };
  });
  $('#pOk', sh).onclick = () => { if (cur) cb(cur); };
}

/* ════════════════ ARRASTRAR PARA ORDENAR (mouse y dedo) ════════════════ */
let drag = null, justDragged = false;
function dragStart(x, y) {
  const t = drag.tile; const r = t.getBoundingClientRect();
  drag.offX = x - r.left; drag.offY = y - r.top; drag.started = true;
  const g = t.cloneNode(true); g.className = 'dragghost ' + t.className; g.style.width = r.width + 'px';
  g.querySelectorAll('img').forEach(im => im.removeAttribute('loading'));
  document.body.appendChild(g); drag.ghost = g;
  t.classList.add('ph'); document.body.classList.add('dragging'); closePop();
  if (navigator.vibrate) try { navigator.vibrate(12); } catch (e) {}
  dragMove(x, y); autoScroll();
}
function flip(grids, fn) {
  const tiles = grids.flatMap(g => $$('.tile', g)); const before = new Map(tiles.map(t => [t, t.getBoundingClientRect()]));
  fn(); grids.forEach(g => $$('.tile', g).forEach(spanOf));
  tiles.forEach(t => {
    if (t === drag.tile) return; const a = before.get(t), b = t.getBoundingClientRect(); if (!a) return;
    const dx = a.left - b.left, dy = a.top - b.top; if (!dx && !dy) return;
    t.style.transition = 'none'; t.style.transform = `translate(${dx}px,${dy}px)`;
    requestAnimationFrame(() => { t.style.transition = 'transform .22s cubic-bezier(.2,.8,.2,1)'; t.style.transform = ''; });
  });
}
function dragMove(x, y) {
  drag.x = x; drag.y = y;

  const el = document.elementFromPoint(x, y); if (!el) return;
  const t = el.closest('.tile'); const grid = el.closest('.grid');
  $$('.sec.drop-on').forEach(s => s.classList.remove('drop-on'));
  if (!grid) return;
  const me = drag.tile; const from = me.parentElement;
  if (t && t !== me && !t.classList.contains('addt')) {
    if (drag.lock === t) return;
    const r = t.getBoundingClientRect(); const before = x < r.left + r.width / 2;
    const ref = before ? t : t.nextSibling; if (ref === me || (ref && ref.previousSibling === me && before)) return;
    flip([...new Set([from, grid])], () => grid.insertBefore(me, ref));
    drag.lock = t; setTimeout(() => { if (drag && drag.lock === t) drag.lock = null; }, 180);
  } else if (grid !== from && (!t || t.classList.contains('addt'))) {

  }
  if (me.parentElement !== drag.origin) me.parentElement.closest('.sec').classList.add('drop-on');
}
function autoScroll() {
  if (!drag || !drag.started) return;
  const edge = 90, y = drag.y; let v = 0;
  if (y < edge + 60) v = -Math.ceil((edge + 60 - y) / 6); else if (y > innerHeight - edge) v = Math.ceil((y - innerHeight + edge) / 6);
  if (v) { scrollBy(0, v); dragMove(drag.x, drag.y); }
  requestAnimationFrame(autoScroll);
}
function dragEnd() {

  if (drag.started) {
    drag.ghost.remove(); drag.tile.classList.remove('ph'); document.body.classList.remove('dragging');
    $$('.sec.drop-on').forEach(s => s.classList.remove('drop-on'));
    // el DOM manda: rearmamos el orden de cada sección
    const all = new Map(); S.secciones.forEach(s => s.items.forEach(i => all.set(i.id, i)));
    S.secciones.forEach(s => { const g = $(`.grid[data-grid="${s.id}"]`); if (g) s.items = $$('.tile[data-id]', g).map(t => all.get(t.dataset.id)).filter(Boolean); });
    const moved = drag.tile.parentElement !== drag.origin;
    changed(); renderSections();
    if (moved) toast('Movido a «' + secTitle(drag.tile.parentElement.dataset.grid) + '»');
    justDragged = true; setTimeout(() => justDragged = false, 60);
  }
  drag = null;
}
document.addEventListener('pointerdown', e => {
  if (e.pointerType === 'touch' || e.button !== 0) return;
  const t = e.target.closest('.grid .tile[data-id]'); if (!t || e.target.closest('.acts') || t.classList.contains('tload')) return;
  drag = { tile: t, origin: t.parentElement, x0: e.clientX, y0: e.clientY, started: false };
});
document.addEventListener('pointermove', e => {
  if (!drag || e.pointerType === 'touch') return;
  if (!drag.started) { if (Math.hypot(e.clientX - drag.x0, e.clientY - drag.y0) > 6) dragStart(e.clientX, e.clientY); return; }

document.addEventListener('pointerup', e => { if (e.pointerType !== 'touch') dragEnd(); });
// dedo: mantener apretado ~0,3 s y mover
document.addEventListener('touchstart', e => {

document.addEventListener('touchmove', e => {

  e.preventDefault(); dragMove(p.clientX, p.clientY);

document.addEventListener('touchend', () => { if (drag && drag.touch) dragEnd(); });
document.addEventListener('touchcancel', () => { if (drag && drag.touch) dragEnd(); });

function secAt(x, y) { const el = document.elementFromPoint(x, y); const s = el && el.closest('.sec'); return s ? s.dataset.sec : null; }
window.addEventListener('dragover', e => {

  const it = { id: uid(), tipo: 'link', url: u }; S.secciones.find(s => s.id === sid).items.push(it);
  changed(); renderSections(); toast('Link agregado a «' + secTitle(sid) + '»');
  enrichLink(it).then(() => { changed(); renderSections(); });
}
document.addEventListener('paste', e => {
  if (!S || !S.started || $('#scrim')) return;
  const tg = e.target; if (tg && (tg.tagName === 'INPUT' || tg.tagName === 'TEXTAREA' || tg.isContentEditable)) return;
  const sid = ACTIVE || (S.secciones[0] && S.secciones[0].id); if (!sid) return;
  const files = [...(e.clipboardData.files || [])].filter(f => /^image\//.test(f.type));
  if (files.length) { e.preventDefault(); return addFiles(files, sid); }
  const txt = (e.clipboardData.getData('text') || '').trim();
  if (isUrl(txt)) { e.preventDefault(); looksImage(txt) ? addImageUrl(txt, sid) : quickLink(txt, sid); }
  else if (txt && txt.length < 400) { e.preventDefault(); S.secciones.find(s => s.id === sid).items.push({ id: uid(), tipo: 'texto', texto: txt }); changed(); renderSections(); toast('Nota pegada en «' + secTitle(sid) + '»'); }
});

/* ════════════════ AYUDA ════════════════ */
const QS = [
  { sec: 'lugares', q: 'Pensá en tu canción. ¿A qué hora suena?', ex: '3 a.m., volviendo en taxi con la ventanilla baja' },
  { sec: 'lugares', q: '¿Dónde pasa? Un lugar concreto, no "la ciudad".', ex: 'La terraza de un edificio, con luces de neón de fondo' },
  { sec: 'ropa', q: '¿Qué tenés puesto en el video?', ex: 'Campera de cuero, todo negro, una cadenita plateada' },
  { sec: 'colores', q: '¿Qué colores NO van con tu música?', ex: 'Nada pastel, nada de amarillo chillón' },
  { sec: 'texturas', q: 'Si tu música se pudiera tocar, ¿cómo se sentiría?', ex: 'Asfalto mojado, cinta VHS gastada, terciopelo' },
  { sec: 'personas', q: '¿Qué artista se ve como vos querés verte?', ex: 'Rosalía en Motomami, la estética de Bad Bunny en Un Verano Sin Ti' },
  { sec: 'portadas', q: '¿Qué portada te hubiese encantado hacer?', ex: 'Buscala en Spotify, sacale captura y subila acá' }
];
function openHelp() {
  const sh = openSheet({ title: '¿No sabés por dónde empezar?', sub: 'Respondé lo que te salga. Cada respuesta se guarda como nota en su sección.', wide: true, cls: 'help', body: `
    <p class="lead">Un moodboard no es arte: es una <b>lista de pistas</b> para que tus fotos, portadas y videos se vean como suena tu música. Empezá por las preguntas y después buscá fotos que se parezcan a tus respuestas.</p>
    ${QS.map((x, i) => `<div class="q" data-q="${i}"><h4>${esc(x.q)}</h4><p>Ej.: <em>${esc(x.ex)}</em> · va a «${esc(secTitle(x.sec) || (TPLMAP[x.sec] || {}).titulo)}»</p>
      <div class="row"><input class="inp" placeholder="Tu respuesta…" maxlength="200" aria-label="${esc(x.q)}"><button class="btn dark" data-ans="${i}">Agregar</button></div></div>`).join('')}
    <label class="fl">Tips</label>
    <div class="tips">
      <div><b>Dónde buscar fotos</b>Pinterest (buscá en inglés: "neon night portrait"), capturas de videoclips, tus propias fotos del celu.</div>
      <div><b>Cuántas</b>Con 3 a 5 cosas por sección alcanza. Mejor pocas y claras que muchas y mezcladas.</div>
      <div><b>La paleta</b>Se arma sola cuando subís fotos. Si un color es "el tuyo", fijalo.</div>
      <div><b>Las palabras</b>3 a 6 palabras que describan el clima. Ej.: <i>nocturno, crudo, íntimo</i>.</div>
    </div>
`,
    foot: `<button class="btn dark" data-close>Listo</button>` });
  $$('[data-ans]', sh).forEach(b => {
    const q = QS[+b.dataset.ans]; const inp = b.previousElementSibling;
    const go = () => {
      const v = inp.value.trim(); if (!v) return toast('Escribí tu respuesta (o usá el ejemplo como idea)');
      const sec = ensureSection(q.sec); sec.items.push({ id: uid(), tipo: 'texto', texto: v });
      changed(); renderSections(); inp.value = ''; b.closest('.q').classList.add('done'); toast('Guardado en «' + sec.titulo + '»');
    };

/* ════════════════ LÁMINA (exportar / imprimir) ════════════════ */
function buildSheet(fmt, theme) {
  const name = projectName() || 'Mi proyecto';
  const gen = manualVal('s_genero');
  const imgs = boardImages().filter(i => !CORS_BAD.has(i.url));
  const notes = []; S.secciones.forEach(s => s.items.forEach(i => { if (i.tipo === 'texto' && i.texto) notes.push(i.texto); }));
  const pal = S.paleta.length ? S.paleta : ['#111111', '#555555', '#999999', '#DDDDDD'];
  const cells = 12, big = 4; const slots = cells - big + 1; // 1 grande + 8 chicos
  const tiles = [];
  imgs.slice(0, slots).forEach((im, k) => tiles.push(`<div${k === 0 ? ' class="x-big"' : ''} style="background-image:url('${String(im.url).replace(/'/g, '%27')}')"></div>`));
  // si faltan imágenes, completa con una frase y bloques de color
  let pi = 0;
  if (tiles.length < slots && notes[0]) tiles.push(`<div class="x-q${tiles.length === 0 ? ' x-big' : ''}">${esc(notes[0].slice(0, 120))}</div>`);
  while (tiles.length < slots) { const c = pal[pi++ % pal.length]; tiles.push(`<div class="x-c${tiles.length === 0 ? ' x-big' : ''}" style="background:${c};color:${fgOn(c)}">${c}</div>`); }
  const nameSize = fmt === 'h' ? (name.length <= 10 ? 150 : name.length <= 18 ? 116 : name.length <= 30 ? 88 : 68) : (name.length <= 10 ? 160 : name.length <= 18 ? 120 : 88);
  const words = S.palabras.length ? S.palabras : [];
  const palHTML = `<div class="x-pal">${pal.slice(0, 6).map(c => `<div><i style="background:${c}"></i><b>${c}</b></div>`).join('')}</div>`;
  const foot = `<div class="x-foot"><span>Moodboard · ${new Date().toLocaleDateString('es-AR', { month: 'long', year: 'numeric' })}</span><span>Artist OS · @larry.prod</span></div>`;
  const el = document.createElement('div'); el.className = `sheetx ${fmt}${theme === 'dark' ? ' dark' : ''}`;
  if (fmt === 'h') el.innerHTML = `<div class="x-left"><div class="x-eb"><span>Moodboard</span></div>
      <div class="x-name" style="font-size:${nameSize}px;margin-top:36px">${esc(name)}</div>${gen ? `<div class="x-gen">${esc(gen)}</div>` : ''}
      <div class="x-words">${words.map(w => `<span>${esc(w)}</span>`).join('')}</div>${palHTML}${foot}</div>
    <div class="x-col">${tiles.join('')}</div>`;
  else el.innerHTML = `<div class="x-eb"><span>Moodboard</span><span>${new Date().getFullYear()}</span></div>
      <div class="x-name" style="font-size:${nameSize}px;margin-top:34px">${esc(name)}</div>${gen ? `<div class="x-gen">${esc(gen)}</div>` : ''}
      <div class="x-words">${words.map(w => `<span>${esc(w)}</span>`).join('')}</div>
      <div class="x-col">${tiles.join('')}</div>${palHTML}${foot}`;
  return el;
}
let H2C = null;
function loadH2C() {
  if (window.html2canvas) return Promise.resolve(window.html2canvas);
  if (H2C) return H2C;
  H2C = new Promise((res, rej) => {
    const s = document.createElement('script'); s.src = 'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';
    s.onload = () => res(window.html2canvas); s.onerror = () => { H2C = null; rej(new Error('sin conexión')); }; document.head.appendChild(s);
  });
  return H2C;
}
async function openExport(fmt) {
  let theme = 'light';
  // revisa qué imágenes se pueden usar (las de otras webs que no dejan copiarse quedan afuera)
  await Promise.all(boardImages().map(i => sampleImg(i.url)));
  const bad = boardImages().filter(i => CORS_BAD.has(i.url)).length;
  const sh = openSheet({ title: 'Exportar moodboard', sub: 'Una lámina prolija con tu nombre, palabras, paleta y collage.', wide: true, body: `
    <div class="expgrid"><div class="expview" id="xv"></div>
    <div class="expside">
      <div><label class="fl">Formato</label><div class="seg" id="xf"><button data-f="h">Horizontal 16:9</button><button data-f="v">Historia 9:16</button></div></div>
      <div><label class="fl">Fondo</label><div class="seg" id="xt"><button data-t="light">Claro</button><button data-t="dark">Oscuro</button></div></div>
      <div><button class="btn dark lg" id="xDl">${ico('down')}Descargar PNG</button></div>
      <div><button class="btn line" id="xPr">${ico('print')}Imprimir / PDF</button></div>
      ${bad ? `<p class="note warn">${bad === 1 ? '1 imagen viene' : bad + ' imágenes vienen'} de otra web que no deja copiarla, así que no entra${bad === 1 ? '' : 'n'} en la lámina. Bajala${bad === 1 ? '' : 's'} y subila${bad === 1 ? '' : 's'} desde tu celu o compu.</p>` : `<p class="note">Entran hasta 9 imágenes, en el orden del tablero. Para cambiar cuáles, ordená el tablero.</p>`}
    </div></div>`, foot: '' });
  const draw = () => {
    $$('#xf button', sh).forEach(b => b.classList.toggle('on', b.dataset.f === fmt));
    $$('#xt button', sh).forEach(b => b.classList.toggle('on', b.dataset.t === theme));
    const v = $('#xv', sh); v.innerHTML = '';
    const el = buildSheet(fmt, theme); const W = fmt === 'h' ? 1920 : 1080, H = fmt === 'h' ? 1080 : 1920;
    const avW = v.clientWidth - 36, avH = Math.min(innerHeight * .62, fmt === 'h' ? 520 : 600);
    const k = Math.min(avW / W, avH / H);
    const box = document.createElement('div'); box.style.width = W * k + 'px'; box.style.height = H * k + 'px'; box.style.position = 'relative';
    el.classList.add('scaler'); el.style.transform = `scale(${k})`; el.style.position = 'absolute'; el.style.left = 0; el.style.top = 0;
    box.appendChild(el); v.appendChild(box);
  };
  $$('#xf button', sh).forEach(b => b.onclick = () => { fmt = b.dataset.f; draw(); });
  $$('#xt button', sh).forEach(b => b.onclick = () => { theme = b.dataset.t; draw(); });
  requestAnimationFrame(draw);
  $('#xPr', sh).onclick = () => { closeSheet(); doPrint(theme); };
  $('#xDl', sh).onclick = async () => {
    const btn = $('#xDl', sh); btn.disabled = true; btn.innerHTML = '<span class="spin" style="width:16px;height:16px;border-color:#555;border-top-color:#fff"></span>Armando la imagen…';
    try {
      const h2c = await loadH2C(); await document.fonts.ready;
      const el = buildSheet(fmt, theme); const host = document.createElement('div');
      host.style.cssText = 'position:fixed;left:-30000px;top:0;'; host.appendChild(el); document.body.appendChild(host);
      await Promise.all($$('.x-col>div', el).map(d => { const m = /url\("?'?([^"')]+)/.exec(d.style.backgroundImage); return m ? loadImg(m[1], true) : null; }));
      const cv = await h2c(el, { scale: 1, useCORS: true, backgroundColor: null, logging: false, width: el.offsetWidth, height: el.offsetHeight, windowWidth: el.offsetWidth });
      host.remove();
      const blob = await new Promise((res, rej) => { try { cv.toBlob(b => b ? res(b) : rej(new Error('vacío')), 'image/png'); } catch (e) { rej(e); } });
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
      a.download = `moodboard-${(projectName() || 'proyecto').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '')}-${fmt === 'h' ? '16x9' : 'historia'}.png`;
      document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 4000);
      toast('Imagen descargada ✓');
    } catch (e) {
      toast(/conexión/.test(e.message) ? 'Necesitás internet para exportar la imagen' : 'No se pudo armar la imagen: alguna foto viene de otra web. Subila desde tu compu o celu.');
    }
    btn.disabled = false; btn.innerHTML = ico('down') + 'Descargar PNG';
  };
}
async function doPrint(theme) {
  const ps = $('#printSheet'); ps.innerHTML = ''; ps.appendChild(buildSheet('h', theme || 'light'));
  toast('Preparando para imprimir…');
  // las imágenes con carga diferida tienen que estar cargadas antes de imprimir
  const imgs = $$('#app img');
  imgs.forEach(i => { i.loading = 'eager'; });
  await Promise.race([
    Promise.all(imgs.map(i => i.complete ? 1 : new Promise(r => { i.addEventListener('load', r, { once: true }); i.addEventListener('error', r, { once: true }); }))),
    new Promise(r => setTimeout(r, 4000))
  ]);
  await document.fonts.ready;
  window.print();
}

/* ════════════════ PRESENTACIÓN ════════════════ */
let pres = null;
function openPresent() {
  const name = projectName() || 'Mi proyecto';
  const slides = [];
  slides.push(`<div class="slide cover"><div class="k">MOODBOARD${manualVal('s_genero') ? ' · ' + esc(manualVal('s_genero')).toUpperCase() : ''}</div><h2>${esc(name)}</h2>
    ${S.palabras.length ? `<div class="w">${S.palabras.map(esc).join(' · ')}</div>` : ''}
    ${S.paleta.length ? `<div class="pbars">${S.paleta.map(c => `<div style="background:${c};color:${fgOn(c)}">${c}</div>`).join('')}</div>` : ''}</div>`);
  S.secciones.forEach((s, i) => {
    if (!s.items.length) return;
    const n = s.items.length;
    const html = s.items.map(it => {
      if (it.tipo === 'img') return imgTag(it.url, it.nota || s.titulo).replace(' loading="lazy"', '');
      if (it.tipo === 'color') { const c = normHex(it.color); return `<div class="pc" style="background:${c};color:${fgOn(c)}">${c}${it.nota ? ' · ' + esc(it.nota) : ''}</div>`; }
      if (it.tipo === 'texto') return `<div class="pq">${esc(it.texto)}</div>`;
      if (it.tipo === 'link') { const li = linkInfo(it.url); const th = it.thumb || li.thumb; return `<a class="pl pf-${li.pf}" href="${esc(it.url)}" target="_blank" rel="noopener">${th ? imgTag(th, '') : ''}<span>${esc(it.texto || li.label)}</span></a>`; }
      return '';
    }).join('');
    slides.push(`<div class="slide"><div class="k">${String(i + 1).padStart(2, '0')} / ${String(S.secciones.length).padStart(2, '0')}</div><h2>${esc(s.titulo)}</h2><div class="pgal" data-n="${n}">${html}</div></div>`);
  });
  const el = document.createElement('div'); el.className = 'pres'; el.id = 'pres'; el.setAttribute('role', 'dialog'); el.setAttribute('aria-label', 'Presentación del moodboard');
  el.innerHTML = `<div class="pbar"><span>${esc(name)}</span><span class="sp"></span><div class="dots">${slides.map(() => '<i></i>').join('')}</div><span class="sp"></span>
    <button data-p="prev" aria-label="Anterior">${ico('l')}</button><button data-p="next" aria-label="Siguiente">${ico('r')}</button><button data-p="full" aria-label="Pantalla completa">${ico('full')}</button><button data-p="close" aria-label="Salir">${ico('x')}</button></div>
    <div class="stage">${slides.join('')}<div class="nav l" data-p="prev"></div><div class="nav r" data-p="next"></div></div>`;
  document.body.appendChild(el); document.body.style.overflow = 'hidden';
  requestAnimationFrame(() => el.classList.add('on'));
  pres = { el, i: 0, n: slides.length };
  const go = i => {
    pres.i = Math.max(0, Math.min(pres.n - 1, i));
    $$('.slide', el).forEach((s, k) => { s.classList.toggle('on', k === pres.i); s.classList.toggle('prev', k < pres.i); });
    $$('.dots i', el).forEach((d, k) => d.classList.toggle('on', k === pres.i));
  };
  const fit = () => $$('.pgal', el).forEach(g => {
    const n = +g.dataset.n, ar = g.clientWidth / Math.max(1, g.clientHeight);
    let best = 1, bs = -Infinity; // columnas que dejan las celdas más cerca de 4:5
    for (let c = 1; c <= Math.min(n, 6); c++) { const r = Math.ceil(n / c); const cell = (ar / c) * r; const sc = -Math.abs(Math.log(cell / .85)) - (c * r - n) * .15; if (sc > bs) { bs = sc; best = c; } }
    g.style.gridTemplateColumns = `repeat(${best},1fr)`; g.style.gridTemplateRows = `repeat(${Math.ceil(n / best)},minmax(0,1fr))`;
  });
  pres.fit = fit; requestAnimationFrame(fit); addEventListener('resize', fit);
  pres.go = go; go(0);
  el.addEventListener('click', e => {
    const b = e.target.closest('[data-p]'); if (!b) return; const a = b.dataset.p;
    if (a === 'prev') go(pres.i - 1); if (a === 'next') go(pres.i + 1); if (a === 'close') closePresent();
    if (a === 'full') { if (document.fullscreenElement) document.exitFullscreen(); else el.requestFullscreen && el.requestFullscreen().catch(() => {}); }
  });
  let sx = null; el.addEventListener('touchstart', e => sx = e.touches[0].clientX, { passive: true });
  el.addEventListener('touchend', e => { if (sx == null) return; const dx = e.changedTouches[0].clientX - sx; if (Math.abs(dx) > 50) go(pres.i + (dx < 0 ? 1 : -1)); sx = null; });
  if (el.requestFullscreen && !isMobile()) el.requestFullscreen().catch(() => {});
}
function closePresent() {
  if (!pres) return; if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
  removeEventListener('resize', pres.fit); pres.el.remove(); pres = null; document.body.style.overflow = '';
}
document.addEventListener('keydown', e => {
  if (!pres) return;
  if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') { e.preventDefault(); pres.go(pres.i + 1); }
  if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); pres.go(pres.i - 1); }
  if (e.key === 'Escape' && !document.fullscreenElement) closePresent();
}, true);

/* ── barra superior ── */
function toggleExp(on) { const m = $('#expMenu'); m.classList.toggle('on', on); $('#bExp').setAttribute('aria-expanded', on); }
$('#bExp').onclick = e => { e.stopPropagation(); toggleExp(!$('#expMenu').classList.contains('on')); };
document.addEventListener('click', e => { if (!e.target.closest('#expW')) toggleExp(false); });
$$('#expMenu [data-exp]').forEach(b => b.onclick = () => {
  toggleExp(false); const a = b.dataset.exp;
  if (a === 'h' || a === 'v') openExport(a); else if (a === 'print') doPrint('light'); else if (a === 'pres') openPresent();

$('#bPres').onclick = openPresent;
$('#bHelp').onclick = openHelp; $('#bHelpS').onclick = openHelp;
addEventListener('scroll', () => $('#top').classList.toggle('sc', scrollY > 4), { passive: true });
let wasMobile = isMobile();
addEventListener('resize', () => {
